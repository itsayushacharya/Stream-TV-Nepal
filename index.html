<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f19] text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream TV Nepal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/itsayushacharya/Stream-TV-Nepal/refs/heads/main/images/site-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: { 500: '#2563eb', 600: '#1d4ed8' }, dark: '#0b0f19' },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
    } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .channel-card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .channel-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,.5); border-color: rgba(37,99,235,.5); }
    .nav-item.active { color: #3b82f6; border-bottom-color: #3b82f6; }
    #playerModal { transition: opacity .3s ease, visibility .3s ease; }
    .text-glow { text-shadow: 0 0 20px rgba(255,255,255,.1); }

    /* Hide scrollbar for horizontal rows */
    .no-sb::-webkit-scrollbar { display: none; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }

    /* Splash screen */
    #splashScreen {
      position: fixed; inset: 0; z-index: 9999; background: #0b0f19;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.5rem; transition: opacity 0.6s ease, visibility 0.6s ease;
      opacity: 1; visibility: visible;
    }
    #splashScreen.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.06); opacity: 1; } }
    #splashScreen img {
      width: 120px; height: 120px; object-fit: contain; border-radius: 20px;
      animation: splashPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(37,99,235,0.45));
    }
    #splashScreen .splash-title { font-size: 1.75rem; font-weight: 900; letter-spacing: -0.02em; }
    #splashScreen .splash-loader {
      width: 180px; height: 4px; background: #1e293b; border-radius: 9999px; overflow: hidden; margin-top: 0.5rem;
    }
    #splashScreen .splash-loader span {
      display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 9999px; animation: splashLoad 1.2s ease-in-out infinite;
    }
    @keyframes splashLoad { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body class="h-full overflow-y-auto antialiased selection:bg-brand-500 selection:text-white">

  <!-- SPLASH SCREEN -->
  <div id="splashScreen">
    <img src="https://raw.githubusercontent.com/itsayushacharya/Stream-TV-Nepal/refs/heads/main/images/site-icon.png" alt="Stream TV Nepal" />
    <div class="splash-title text-center">
      <span class="text-blue-500">Stream</span><span class="text-white">TV Nepal</span>
    </div>
    <div class="splash-loader"><span></span></div>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center font-black text-2xl tracking-tighter cursor-pointer" onclick="showView('home')">
          <span class="text-blue-500 mr-1">Stream</span><span class="text-white">TV Nepal</span>
        </div>
        <nav class="flex items-center gap-5 sm:gap-8 h-full overflow-x-auto">
          <a href="#" data-nav="home" onclick="showView('home'); return false;" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors active"><i class="fa-solid fa-house"></i> Home</a>
          <button data-nav="live" onclick="openLive()" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors"><i class="fa-solid fa-tv"></i> Live TV</button>
          <a href="movies.html" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors"><i class="fa-regular fa-circle-play"></i> Movies</a>
          <a href="series.html" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors"><i class="fa-solid fa-layer-group"></i> Series</a>
        </nav>
        <div class="flex items-center space-x-5 text-slate-300">
          <div class="relative hidden sm:block">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search channels..." class="bg-slate-900 border border-slate-700 text-sm rounded-full pl-9 pr-4 py-1.5 focus:outline-none focus:border-brand-500 w-48 transition-all focus:w-64 placeholder-slate-500 text-white" oninput="filterChannels()">
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section id="heroSection" class="relative w-full h-[450px] sm:h-[500px] lg:h-[550px] overflow-hidden bg-slate-900 border-b border-slate-800">
    <div class="absolute inset-0">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBxnUkh7jJ8aUJjuMHL4Uo-tBVsvSC-Bv3rxH8nB_qF9hyEmEG8CItsNAJ&s=10" alt="Hero Background" class="w-full h-full object-cover object-center opacity-40 mix-blend-luminosity" />
      <div class="absolute inset-0 bg-gradient-to-r from-[#0b0f19] via-[#0b0f19]/80 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-transparent to-transparent"></div>
    </div>

    <div class="relative max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 h-full flex flex-col justify-center">
      <div class="max-w-2xl z-10">
        <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-300 leading-tight mb-2 tracking-wide text-glow">
          Your Screen, Your Stream, <span class="text-white">Anytime</span>
        </h2>
        <h2 class="text-5xl sm:text-6xl lg:text-7xl font-black text-white leading-tight mb-4 flex flex-wrap items-center gap-x-4">
          Stream <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-yellow-600">Unlimited</span>
        </h2>
        <p class="text-lg text-slate-300 font-medium mb-8">Watch live channels, movies, and shows — all in one place.</p>
        <button onclick="document.getElementById('news-section').scrollIntoView({behavior:'smooth'})" class="bg-brand-500 hover:bg-brand-600 text-white font-semibold py-3 px-8 rounded shadow-lg shadow-brand-500/30 transition-colors">Watch Now</button>
      </div>
    </div>
  </section>

  <!-- MAIN -->
  <main id="homeMain" class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-12 relative z-10">
    
    <!-- NEWS SECTION -->
    <section id="news-section">
      <div class="flex items-center justify-between mb-5 border-l-4 border-brand-500 pl-3">
        <h3 class="text-xl font-bold text-white tracking-wide">News Channel</h3>
      </div>
      <div id="news-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-4"></div>
    </section>

    <!-- SPORTS SECTION -->
    <section id="sports-section">
      <div class="flex items-center justify-between mb-5 border-l-4 border-brand-500 pl-3">
        <h3 class="text-xl font-bold text-white tracking-wide">Sports & Live Events</h3>
      </div>
      <div id="sports-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-4"></div>
    </section>

    <!-- ENTERTAINMENT SECTION (Horizontal Row) -->
    <section id="entertainment-section">
      <div class="flex items-center justify-between mb-5 border-l-4 border-brand-500 pl-3">
        <h3 class="text-xl font-bold text-white tracking-wide">Entertainment & Movies</h3>
        <button onclick="openEntertainment()" class="text-sm text-blue-400 hover:text-blue-300 font-semibold flex items-center gap-1">
          See all <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
      </div>
      <!-- Horizontal scroll container -->
      <div id="entertainment-row" class="flex gap-4 overflow-x-auto no-sb pb-4 snap-x scroll-smooth"></div>
    </section>

  </main>

  <!-- PLAYER MODAL -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-[#0b0f19] hidden opacity-0 overflow-y-auto">
    <div class="max-w-[1600px] mx-auto p-3 sm:p-5 flex flex-col lg:flex-row gap-4 lg:h-full lg:min-h-0">
      
      <!-- LEFT: Player + Controls -->
      <div class="flex flex-col gap-4 flex-1 min-h-0 lg:overflow-y-auto">
        <!-- Video Container -->
        <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 shadow-2xl shrink-0">
          <video id="videoPlayer" class="w-full h-full object-contain bg-black" playsinline></video>

          <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-black/50 hidden z-10">
            <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
          </div>

          <div id="errorOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0b0f19]/95 hidden text-center p-6 z-10">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl mb-3"></i>
            <h3 class="text-white font-bold text-xl mb-1">Stream Unavailable</h3>
            <p id="errorMessage" class="text-slate-400 text-sm max-w-md mb-4"></p>
            <button onclick="retryStream()" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-2 rounded font-medium">
              <i class="fa-solid fa-rotate-right mr-2"></i>Retry
            </button>
          </div>
        </div>

        <!-- Custom Player Controls Bar -->
        <div class="flex items-center justify-between bg-[#161b26] border border-slate-800 rounded-xl px-4 py-3 shrink-0">
          <div class="flex items-center gap-6">
            <button onclick="togglePlay()" id="btnPlayPause" class="text-white hover:text-blue-400 transition">
              <i class="fa-solid fa-pause text-xl"></i>
            </button>
            <button onclick="toggleMute()" id="btnMute" class="text-white hover:text-blue-400 transition">
              <i class="fa-solid fa-volume-high text-xl"></i>
            </button>
            <div class="h-6 w-px bg-slate-700 hidden sm:block"></div>
            <div class="hidden sm:flex items-center gap-3">
              <div class="w-8 h-8 rounded bg-white flex items-center justify-center overflow-hidden shrink-0">
                <img id="onNowLogo" class="max-w-full max-h-full object-contain" />
              </div>
              <div>
                <h2 id="modalChannelTitle" class="text-white font-bold text-sm leading-tight">Channel Name</h2>
                <p class="text-xs text-red-500 font-semibold flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> LIVE
                </p>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <button onclick="toggleFullscreen()" id="btnFullscreen" class="text-white hover:text-blue-400 transition">
              <i class="fa-solid fa-expand text-xl"></i>
            </button>
            <button onclick="closePlayer()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-sm font-semibold px-4 py-1.5 rounded-lg border border-red-500/30 transition">
              Close
            </button>
          </div>
        </div>
      </div>

      <!-- RIGHT: Channel List -->
      <aside class="flex flex-col gap-3 lg:w-[400px] shrink-0 lg:h-full lg:min-h-0">
        <!-- Filter Bar -->
        <div class="flex flex-wrap items-center gap-2 bg-[#111827] border border-slate-800 rounded-xl p-2 shrink-0">
          <div class="flex gap-1 overflow-x-auto text-sm font-semibold no-sb">
            <button data-f="all" class="ptab px-4 py-1.5 rounded-full whitespace-nowrap">All</button>
            <button data-f="news" class="ptab px-4 py-1.5 rounded-full whitespace-nowrap">News</button>
            <button data-f="sports" class="ptab px-4 py-1.5 rounded-full whitespace-nowrap">Sports</button>
            <button data-f="entertainment" class="ptab px-4 py-1.5 rounded-full whitespace-nowrap">Entertainment</button>
          </div>
          <div class="relative ml-auto">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input id="panelSearch" placeholder="Search" class="w-28 sm:w-32 bg-slate-900 border border-slate-700 rounded-full pl-7 pr-2 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500" />
          </div>
        </div>
        
        <!-- Channel Grid -->
        <div class="flex-1 overflow-y-auto bg-[#111827] border border-slate-800 rounded-xl p-3 min-h-0">
          <div id="panelGrid" class="grid grid-cols-4 sm:grid-cols-5 lg:grid-cols-3 gap-2 sm:gap-3"></div>
        </div>
      </aside>

    </div>
  </div>

  <script>
    // ===================== SPLASH SCREEN =====================

      const splash = document.getElementById('splashScreen');
      if (sessionStorage.getItem('stn_splash_shown')) {

        return;

      const hideSplash = () => {
        setTimeout(() => splash.classList.add('splash-hidden'), 900);

      setTimeout(() => splash.classList.add('splash-hidden'), 3500);

    ];

    // ===================== PLAYLISTS =====================
    const PLAYLISTS = [
      { name: "India (Hindi & more)", url: "https://iptv-org.github.io/iptv/countries/in.m3u" },
      { name: "Nepal", url: "https://iptv-org.github.io/iptv/countries/np.m3u" }
    ];
    let channels = [...staticChannels];

    // ===================== M3U PARSER =====================
    function parseM3U(text, groupName) {
      const lines = text.split('\n');
      const out = [];
      let info = null;
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.*)$/);
          const name = nameMatch ? nameMatch[1].trim() : 'Unknown';
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          info = {
            name,
            logoUrl: logoMatch ? logoMatch[1] : '',
            logoText: name.split(' ').map(w => w[0]).join('').slice(0, 4).toUpperCase(),
            categoryKey: 'entertainment', 
            playlistGroup: groupName,
            badge: 'LIVE'
          };
        } else if (line && !line.startsWith('#') && info) {
          info.url = line;
          out.push(info);
          info = null;
        }
      }
      return out;
    }

    // ===================== HOME GRID =====================
    const grids = {
      news: document.getElementById('news-grid'),
      sports: document.getElementById('sports-grid'),
      entertainmentRow: document.getElementById('entertainment-row')
    };

    function createChannelCard(ch, i) {
      const bgClass = ch.logoUrl ? 'bg-white' : 'bg-[#161b26]';
      const textClass = ch.logoUrl ? 'text-slate-900' : 'text-white';
      const imgHtml = ch.logoUrl
        ? `<img src="${ch.logoUrl}" alt="${ch.name}" class="max-h-16 object-contain drop-shadow-sm transition-transform group-hover:scale-110" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
           <span class="hidden text-center font-bold text-xl px-2 ${textClass}">${ch.logoText}</span>`
        : `<span class="text-center font-bold text-xl px-2 ${textClass}">${ch.logoText}</span>`;
      const badgeHtml = ch.badge
        ? `<div class="absolute top-1 right-1 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow z-10">${ch.badge}</div>` : '';
      
      // Add shrink-0 and w-32/w-40 classes for the horizontal row
      return `
        <div onclick="openPlayer(${i})" class="channel-card cursor-pointer bg-[#161b26] rounded-xl overflow-hidden aspect-square flex flex-col group relative border border-slate-800 shrink-0 w-32 sm:w-40 snap-start">
          ${badgeHtml}
          <div class="flex-1 p-4 flex items-center justify-center ${bgClass}">${imgHtml}</div>
          <div class="bg-black/80 p-2 text-center backdrop-blur-sm border-t border-white/5 h-10 flex items-center justify-center">
            <p class="text-[11px] font-semibold text-slate-300 truncate group-hover:text-white transition-colors">${ch.name}</p>
          </div>
        </div>`;
    }

    function renderHomeRows() {
      // News & Sports
      const htmlNews = { news: '', sports: '' };
      channels.forEach((ch, i) => {
        if (htmlNews[ch.categoryKey] !== undefined) htmlNews[ch.categoryKey] += createChannelCard(ch, i);
      });
      grids.news.innerHTML = htmlNews.news;
      grids.sports.innerHTML = htmlNews.sports;

      // Entertainment (Limit to 10 for the home row)
      const entChannels = channels.filter(c => c.categoryKey === 'entertainment').slice(0, 10);
      grids.entertainmentRow.innerHTML = entChannels.map(ch => {
        const realIdx = channels.findIndex(c => c.id === ch.id || c.url === ch.url);
        return createChannelCard(ch, realIdx);
      }).join('');
    }
    renderHomeRows();

    // ===================== LOAD PLAYLISTS =====================
    async function loadPlaylists() {
      const loaded = [];
      for (const p of PLAYLISTS) {
        try {
          const res = await fetch(p.url);
          const text = await res.text();
          const chans = parseM3U(text, p.name);
          loaded.push(...chans);
        } catch (e) {
          console.warn('Failed to load playlist', p.name, e);
        }
      }
      if (loaded.length) {
        channels = [...staticChannels, ...loaded];
        renderHomeRows();
        renderPanel();
      }
    }
    loadPlaylists();

    function filterChannels() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.channel-card').forEach(card => {
        card.style.display = card.querySelector('p').textContent.toLowerCase().includes(q) ? 'flex' : 'none';
      });
    }

    // ===================== NAV / VIEWS =====================
    let currentView = 'home';
    function setNav(name) {
      document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
    }
    function showView(v) {
      currentView = v;
      if (!playerModal.classList.contains('hidden')) closePlayer();
      document.getElementById('heroSection').classList.toggle('hidden', v !== 'home');
      document.getElementById('homeMain').classList.toggle('hidden', v !== 'home');
      setNav(v);
      window.scrollTo(0, 0);
    }
    function openLive() { setNav('live'); openPlayer(0); }
    function openSport() {
      const i = channels.findIndex(c => c.categoryKey === 'sports');
      setNav('sport'); openPlayer(Math.max(0, i)); setFilter('sports');
    }
    function openEntertainment() {
      const i = channels.findIndex(c => c.categoryKey === 'entertainment');
      openPlayer(Math.max(0, i)); 
      setFilter('entertainment');
    }

    // ===================== PLAYER =====================
    const playerModal = document.getElementById('playerModal');
    const video = document.getElementById('videoPlayer');
    const modalChannelTitle = document.getElementById('modalChannelTitle');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorMessage = document.getElementById('errorMessage');
    const panelGrid = document.getElementById('panelGrid');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnMute = document.getElementById('btnMute');
    const btnFullscreen = document.getElementById('btnFullscreen');

    let hls = null, currentUrl = '', currentIndex = -1, panelFilter = 'all', panelQuery = '';

    // Custom Controls
    function togglePlay() {
      if (video.paused) video.play();
      else video.pause();
    }
    video.addEventListener('play', () => btnPlayPause.innerHTML = '<i class="fa-solid fa-pause text-xl"></i>');
    video.addEventListener('pause', () => btnPlayPause.innerHTML = '<i class="fa-solid fa-play text-xl"></i>');

    function toggleMute() {
      video.muted = !video.muted;
      if (video.muted) btnMute.innerHTML = '<i class="fa-solid fa-volume-xmark text-xl"></i>';
      else btnMute.innerHTML = '<i class="fa-solid fa-volume-high text-xl"></i>';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        video.requestFullscreen().catch(err => console.log(err));
        btnFullscreen.innerHTML = '<i class="fa-solid fa-compress text-xl"></i>';
      } else {
        document.exitFullscreen();
        btnFullscreen.innerHTML = '<i class="fa-solid fa-expand text-xl"></i>';
      }
    }
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) btnFullscreen.innerHTML = '<i class="fa-solid fa-expand text-xl"></i>';
      else btnFullscreen.innerHTML = '<i class="fa-solid fa-compress text-xl"></i>';
    });

    // Grid rendering for player panel
    function renderPanel() {
      panelGrid.innerHTML = channels.map((c, i) => ({ c, i }))
        .filter(({ c }) => (panelFilter === 'all' || c.categoryKey === panelFilter) && c.name.toLowerCase().includes(panelQuery))
        .map(({ c, i }) => `
          <button onclick="playByIndex(${i})" title="${c.name}"
            class="relative aspect-square rounded-lg bg-white flex items-center justify-center p-2 border-2 ${i === currentIndex ? 'border-blue-500' : 'border-transparent'} hover:border-blue-400 transition">
            ${c.logoUrl
              ? `<img src="${c.logoUrl}" class="max-w-full max-h-full object-contain" onerror="this.outerHTML='<span class=\\'text-slate-900 font-bold text-xs\\'>${c.logoText}</span>'" />`
              : `<span class="text-slate-900 font-bold text-xs">${c.logoText}</span>`}
          </button>`).join('');
    }

    function setFilter(f) {
      panelFilter = f;
      document.querySelectorAll('.ptab').forEach(b => {
        const on = b.dataset.f === f;
        b.className = 'ptab px-4 py-1.5 rounded-full whitespace-nowrap ' + (on ? 'bg-blue-700 text-white' : 'text-slate-300 hover:text-white');
      });
      renderPanel();
    }
    document.querySelectorAll('.ptab').forEach(b => b.onclick = () => setFilter(b.dataset.f));
    document.getElementById('panelSearch').oninput = e => { panelQuery = e.target.value.toLowerCase(); renderPanel(); };

    function playByIndex(i) {
      const c = channels[i];
      currentIndex = i;
      currentUrl = c.url;
      modalChannelTitle.textContent = c.name;
      document.getElementById('onNowLogo').src = c.logoUrl || '';
      renderPanel();
      initStream(c.url);
    }

    function openPlayer(i) {
      playerModal.classList.remove('hidden');
      setTimeout(() => playerModal.classList.remove('opacity-0'), 10);
      document.body.style.overflow = 'hidden';
      setFilter('all');
      playByIndex(i);
    }

    function closePlayer() {
      playerModal.classList.add('opacity-0');
      setTimeout(() => {
        playerModal.classList.add('hidden');
        document.body.style.overflow = 'auto';
        setNav(currentView);
        if (hls) { hls.destroy(); hls = null; }
        video.pause(); video.removeAttribute('src'); video.load();
      }, 300);
    }

    function initStream(url) {
      loadingOverlay.classList.remove('hidden');
      errorOverlay.classList.add('hidden');
      if (hls) { hls.destroy(); hls = null; }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true, lowLatencyMode: true,
          manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 3,
          levelLoadingTimeOut: 15000, levelLoadingMaxRetry: 3,
          fragLoadingTimeOut: 20000, fragLoadingMaxRetry: 5,
          xhrSetup: xhr => { xhr.withCredentials = false; }
        });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          loadingOverlay.classList.add('hidden');
          video.play().catch(e => console.log('Autoplay blocked:', e));
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (!data.fatal) return;
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              if (!hls.retryAttempted) { hls.retryAttempted = true; setTimeout(() => hls.startLoad(), 2000); }
              else showError('Network/CORS Error: The stream server is unreachable, blocked, or the token expired.');
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              hls.recoverMediaError();
              break;
            default:
              showError('Playback failed due to an unknown stream error.');
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.onloadedmetadata = () => { loadingOverlay.classList.add('hidden'); video.play().catch(() => {}); };
        video.onerror = () => showError('Native playback failed to load the stream.');
      } else {
        showError('Your browser does not support HLS playback.');
      }
    }

    function showError(msg) {
      loadingOverlay.classList.add('hidden');
      errorOverlay.classList.remove('hidden');
      errorMessage.textContent = msg;
    }
    function retryStream() { if (currentUrl) initStream(currentUrl); }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !playerModal.classList.contains('hidden')) closePlayer();
    });
  </script>
