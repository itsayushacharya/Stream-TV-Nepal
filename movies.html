  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: { 500: '#2563eb', 600: '#1d4ed8' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
    } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .nav-item.active { color: #3b82f6; border-bottom-color: #3b82f6; }
    .no-sb { scrollbar-width: none; } .no-sb::-webkit-scrollbar { display: none; }
    .movie-card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .movie-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,.5); border-color: rgba(37,99,235,.5); }
    .row-scroll { scroll-behavior: smooth; }

      <button data-cat="bollywood" class="ctab px-5 py-2 rounded-full whitespace-nowrap">Bollywood</button>
      <button data-cat="hollywood" class="ctab px-5 py-2 rounded-full whitespace-nowrap">Hollywood</button>
    </div>
    <div id="rows" class="space-y-10"></div>
    <p id="emptyMsg" class="hidden text-center text-slate-500 py-20">No movies found.</p>
  </main>

  <!-- DETAILS PANEL -->

    <div class="relative w-full max-w-2xl bg-[#161b26] border border-slate-700 rounded-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
      <button onclick="closeDetails()" class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-black/60 hover:bg-black/80 text-white"><i class="fa-solid fa-xmark"></i></button>
      <div id="dBanner" class="h-56 sm:h-72 bg-slate-800 bg-cover bg-center relative">

      </div>

        <button id="dPlay" class="bg-brand-500 hover:bg-brand-600 text-white font-bold px-7 py-3 rounded-lg inline-flex items-center gap-2 shadow-lg shadow-brand-500/30"><i class="fa-solid fa-play"></i> Play Now</button>
      </div>
    </div>
  </div>

    <video id="moviePlayer" class="w-full h-full hidden" controls autoplay playsinline></video>
    <iframe id="movieFrame" class="w-full h-full hidden border-0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    <div id="noSource" class="hidden flex-col items-center text-center p-6">

    // ===================== MAP DB → movies.html SHAPE =====================
    // movies.html expects: { category, title, year, genre, rating, poster, banner, desc, url }
    const movies = contentDatabase
      .filter(m => m.type === "movie") // ← only movies (skip series)
      .map(m => ({
        category: m.industry,          // 'bollywood' | 'hollywood'
        title: m.title,
        year: (m.releaseDate || '').slice(0, 4) || 'N/A',
        genre: m.genre,
        rating: m.rating,
        poster: m.poster,
        banner: '',
        desc: m.description || '',
        url: m.streamUrl || ''
      }));

    const SECTIONS = { bollywood: 'Bollywood Hits', hollywood: 'Hollywood Blockbusters' };

    let cat = 'all';

    function card(m, i, wide) {
      return `
        <div onclick="openDetails(${i})" class="movie-card cursor-pointer ${wide ? '' : 'shrink-0 w-36 sm:w-44'} rounded-xl overflow-hidden bg-[#161b26] border border-slate-800">
          <div class="aspect-[2/3] bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center">
            ${m.poster ? `<img src="${m.poster}" alt="${m.title}" class="w-full h-full object-cover" onerror="this.style.display='none'" />` : `<i class="fa-solid fa-film text-3xl text-slate-600"></i>`}
          </div>
          <div class="p-2.5">
            <div class="flex justify-between text-[10px] font-bold uppercase mb-1"><span class="text-blue-400">${m.category}</span><span class="text-yellow-400">★ ${m.rating}</span></div>
            <p class="text-xs font-semibold text-slate-200 truncate">${m.title}</p>
            <p class="text-[11px] text-slate-500">${m.year} • ${m.genre}</p>
          </div>
        </div>`;
    }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const keys = cat === 'all' ? Object.keys(SECTIONS) : [cat];
      let total = 0;
      document.getElementById('rows').innerHTML = keys.map(k => {
        const list = movies.map((m, i) => ({ m, i })).filter(({ m }) => m.category === k && m.title.toLowerCase().includes(q));
        if (!list.length) return '';
        total += list.length;
        const single = cat !== 'all';
        return `
          <section>
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-bold text-white border-l-4 border-brand-500 pl-3">${SECTIONS[k]}</h2>
              ${single ? '' : `<div class="flex gap-2">
                <button onclick="scrollRow('${k}',-1)" class="w-9 h-9 rounded-full bg-white/5 hover:bg-brand-500 text-white"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                <button onclick="scrollRow('${k}',1)" class="w-9 h-9 rounded-full bg-white/5 hover:bg-brand-500 text-white"><i class="fa-solid fa-chevron-right text-xs"></i></button></div>`}
            </div>
            <div id="row-${k}" class="${single ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4' : 'row-scroll no-sb flex gap-4 overflow-x-auto pb-2'}">
              ${list.map(({ m, i }) => card(m, i, single)).join('')}
            </div>
          </section>`;
      }).join('');
      document.getElementById('emptyMsg').classList.toggle('hidden', total > 0);
    }

    function scrollRow(k, dir) {
      const el = document.getElementById('row-' + k);
      el.scrollBy({ left: dir * el.clientWidth * 0.8 });
    }

    document.querySelectorAll('.ctab').forEach(b => b.onclick = () => setCat(b.dataset.cat));
    function setCat(c) {
      cat = c;
      document.querySelectorAll('.ctab').forEach(b => {
        b.className = 'ctab px-5 py-2 rounded-full whitespace-nowrap ' + (b.dataset.cat === c ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30' : 'bg-slate-900 text-slate-300 hover:text-white');
      });
      render();
    }

    // ===================== DETAILS =====================
    const detailsModal = document.getElementById('detailsModal');
    let current = null;
    function openDetails(i) {
      const m = movies[i]; current = m;
      document.getElementById('dBanner').style.backgroundImage = (m.banner || m.poster) ? `url('${m.banner || m.poster}')` : '';
      document.getElementById('dTitle').textContent = m.title;
      document.getElementById('dRating').textContent = '★ ' + m.rating;
      document.getElementById('dYear').textContent = m.year;
      document.getElementById('dGenre').textContent = m.genre;
      document.getElementById('dDesc').textContent = m.desc;
      document.getElementById('dPlay').onclick = () => playMovie(m);
      detailsModal.classList.remove('hidden'); detailsModal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
    function closeDetails() {
      detailsModal.classList.add('hidden'); detailsModal.classList.remove('flex');
      document.body.style.overflow = 'auto';
    }

    // ===================== PLAYER =====================
    const playerModal = document.getElementById('playerModal');
    const vid = document.getElementById('moviePlayer');
    const frame = document.getElementById('movieFrame');
    const noSource = document.getElementById('noSource');
    let hls = null;

    function stopPlayer() {
      if (hls) { hls.destroy(); hls = null; }
      vid.pause(); vid.removeAttribute('src'); vid.load();
      frame.src = '';
      [vid, frame].forEach(e => e.classList.add('hidden'));
      noSource.classList.add('hidden'); noSource.classList.remove('flex');
    }
    function playMovie(m) {
      stopPlayer();
      playerModal.classList.remove('hidden'); playerModal.classList.add('flex');
      if (!m.url) { noSource.classList.remove('hidden'); noSource.classList.add('flex'); return; }
      if (/\.m3u8(\?|$)/.test(m.url) && window.Hls && Hls.isSupported()) {
        vid.classList.remove('hidden');
        hls = new Hls(); hls.loadSource(m.url); hls.attachMedia(vid);
        hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
      } else if (/\.(mp4|webm|m3u8)(\?|$)/.test(m.url)) {
        vid.classList.remove('hidden'); vid.src = m.url; vid.play().catch(() => {});
      } else {
        frame.classList.remove('hidden'); frame.src = m.url;
      }
    }
    function closePlayer() {
      stopPlayer();
      playerModal.classList.add('hidden'); playerModal.classList.remove('flex');
    }
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!playerModal.classList.contains('hidden')) closePlayer(); else closeDetails();
    });

    setCat('all');
  </script>
</body>
</html>
