<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f19] text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shows - Stream TV Nepal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/itsayushacharya/Stream-TV-Nepal/refs/heads/main/images/site-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: { 500: '#2563eb', 600: '#1d4ed8' } },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
    } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .nav-item.active { color: #3b82f6; border-bottom-color: #3b82f6; }
    .no-sb { scrollbar-width: none; } .no-sb::-webkit-scrollbar { display: none; }
    .movie-card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .movie-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,.5); border-color: rgba(37,99,235,.5); }
    .row-scroll { scroll-behavior: smooth; }
  </style>
</head>
<body class="h-full overflow-y-auto antialiased selection:bg-brand-500 selection:text-white">

  <!-- HEADER (same as index.html) -->
  <header class="sticky top-0 z-40 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center font-black text-2xl tracking-tighter">
          <span class="text-blue-500 mr-1">Stream</span><span class="text-white">TV Nepal</span>
        </a>
        <nav class="flex items-center gap-5 sm:gap-8 h-full overflow-x-auto no-sb">
          <a href="index.html" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors"><i class="fa-solid fa-house"></i> Home</a>
          <a href="index.html#live" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors"><i class="fa-solid fa-tv"></i> Live TV</a>
          <a href="movies.html" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors"><i class="fa-regular fa-circle-play"></i> Movies</a>
          <a href="series.html" class="nav-item active flex items-center gap-2 text-sm font-semibold border-b-2 border-transparent h-full px-1 whitespace-nowrap"><i class="fa-solid fa-layer-group"></i> Series</a>
               <!--   <button data-nav="sport" onclick="openSport()" class="nav-item flex items-center gap-2 text-sm font-semibold text-slate-400 hover:text-white border-b-2 border-transparent h-full px-1 whitespace-nowrap transition-colors"><i class="fa-regular fa-futbol"></i> Sport</button>-->
        </nav>
        <div class="relative hidden sm:block">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          <input id="searchInput" type="text" placeholder="Search shows..." oninput="render()" class="bg-slate-900 border border-slate-700 text-sm rounded-full pl-9 pr-4 py-1.5 focus:outline-none focus:border-brand-500 w-48 transition-all focus:w-64 placeholder-slate-500 text-white">
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="rows" class="space-y-10"></div>
    <p id="emptyMsg" class="hidden text-center text-slate-500 py-20">No shows found.</p>
  </main>

  <!-- DETAILS PANEL -->
  <div id="detailsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-md p-4" onclick="if(event.target===this)closeDetails()">
    <div class="relative w-full max-w-2xl bg-[#161b26] border border-slate-700 rounded-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
      <button onclick="closeDetails()" class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-black/60 hover:bg-black/80 text-white"><i class="fa-solid fa-xmark"></i></button>
      <div id="dBanner" class="h-56 sm:h-72 bg-slate-800 bg-cover bg-center relative">
        <div class="absolute inset-0 bg-gradient-to-t from-[#161b26] to-transparent"></div>
      </div>
      <div class="p-6 -mt-10 relative">
        <h2 id="dTitle" class="text-2xl sm:text-3xl font-extrabold text-white mb-2"></h2>
        <div class="flex flex-wrap items-center gap-3 text-sm text-slate-400 mb-4">
          <span id="dRating" class="text-yellow-400 font-bold"></span><span id="dYear"></span><span>•</span><span id="dGenre"></span>
        </div>
        <p id="dDesc" class="text-slate-300 leading-relaxed mb-6"></p>
        <button id="dPlay" class="bg-brand-500 hover:bg-brand-600 text-white font-bold px-7 py-3 rounded-lg inline-flex items-center gap-2 shadow-lg shadow-brand-500/30"><i class="fa-solid fa-play"></i> Play Now</button>
      </div>
    </div>
  </div>

  <!-- PLAYER -->
  <div id="playerModal" class="fixed inset-0 z-[60] bg-black hidden items-center justify-center">
    <button onclick="closePlayer()" class="absolute top-4 right-4 z-20 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
    <video id="moviePlayer" class="w-full h-full hidden" controls autoplay playsinline></video>
    <iframe id="movieFrame" class="w-full h-full hidden border-0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    <div id="noSource" class="hidden flex-col items-center text-center p-6">
      <i class="fa-solid fa-film text-5xl text-slate-600 mb-3"></i>
      <p class="text-white font-bold text-lg">Video not added yet</p>
      <p class="text-slate-400 text-sm">Add a <code>url</code> (.m3u8, .mp4 or embed link) to this show.</p>
    </div>
  </div>

  <script>
    // ===================== CONTENT DATABASE (source: app.js contentDatabase) =====================
    // Only entries with type === "series" are kept here.
    const contentDatabase = [
      {
        id: "Musafir-Cafe", title: "Musafir Cafe", type: "series", genre: "Drama",
        industry: "series", rating: "7.1",
        poster: "https://media.themoviedb.org/t/p/w600_and_h900_face/1SbKjtoRKIpVQG5iYnumnfQIqhd.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt39665097",
        releaseDate: "2026-07-24",
        description: "Chander feels an undeniable connection with Sudha. Years later, he builds a new life in the hills with Preeti, but memories of the past linger."
      },
      {
        id: "Pritam-and-Pedro", title: "Pritam and Pedro", type: "series", genre: "Crime/Comedy",
        industry: "series", rating: "8.3",
        poster: "https://image.tmdb.org/t/p/w500/uA5hAexR9Xis3BzSOMKjNuYQUsj.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt28077038",
        releaseDate: "2026-07-03",
        description: "The dynamic between the two contrasting personalities, a seasoned cop who prefers old-school methods and a tech-savvy cop who relies on modern technology for investigations, as they navigate their partnership in solving crimes."
      },
      {
        id: "A-Knight-of-the-Seven-Kingdoms", title: "A Knight of the Seven Kingdoms", type: "series", genre: "Epic/Dark Fantasy",
        industry: "series", rating: "8.6",
        poster: "https://m.media-amazon.com/images/M/MV5BYzg4M2U3YWMtMWY4MS00MzFkLTk2ZWQtOThiOGYxZDEyMGQ2XkEyXkFqcGc@._V1_.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt27497448",
        releaseDate: "2026-04-17",
        description: "A century before the events of 'Game of Thrones', Ser Duncan the Tall, and his squire, Egg, wander through Westeros while the Targaryen dynasty rule the Iron Throne."
      },
      {
        id: "The-Boys", title: "The Boys Season 1-5", type: "series", genre: "Satire/Dark Comedy",
        industry: "series", rating: "8.5",
        poster: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMhlx0wpKRG9fPPwRh9rXEV2Bw71HNMJHi5q3Q5q3iOxj09T1AxeWRwcg&s=10",
        streamUrl: "https://streamimdb.ru/embed/tv/tt1190634",
        releaseDate: "2026-04-08",
        description: "A group of vigilantes set out to take down corrupt superheroes who abuse their superpowers."
      },
      {
        id: "Matka-King", title: "Matka King", type: "series", genre: "Drama",
        industry: "series", rating: "7.2",
        poster: "https://m.media-amazon.com/images/M/MV5BNjg3ZmExNjctNGI3Yi00MWRlLWExYjMtODg5ZmE1Yjc4MTU2XkEyXkFqcGc@._V1_.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt16997004",
        releaseDate: "2026-04-17",
        description: "An enterprising cotton trader in Mumbai starts a new gambling game called Matka, taking the city by storm and democratizing a terrain previously reserved for the rich and elite."
      },
      {
        id: "gullak", title: "Gullak Season 1-5", type: "series", genre: "Family/Comedy/Drama",
        industry: "series", rating: "9.1",
        poster: "https://i.pinimg.com/736x/26/33/50/263350b944e1b0c5151cc9cb95b10b47.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt10530900",
        releaseDate: "2019-05-19",
        description: "Set in quaint by-lanes in the heart of India, Gullak is a collection of disarming and relatable tales of the Mishra family."
      },
      {
        id: "panchayat", title: "Panchayat Season 1-4", type: "series", genre: "Satire/Drama/Comedy",
        industry: "series", rating: "9.0",
        poster: "https://m.media-amazon.com/images/M/MV5BNjMwYWMxNjYtY2I2NC00OWE0LTg4MmQtMmI5ZGI2NzU4ODhiXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt12004706",
        releaseDate: "2020-06-24",
        description: "A comedy-drama, which captures the journey of an engineering graduate Abhishek, who for lack of a better job option joins as secretary of a Panchayat office in a remote village of Uttar Pradesh."
      },
      {
        id: "taaza-khabar", title: "Taaza Khabar", type: "series", genre: "Thriller",
        industry: "series", rating: "8.0",
        poster: "https://m.media-amazon.com/images/M/MV5BNjAzMDEzZmUtYjgzMy00NTYxLWJlODItYTMyZGI4YzdmZGY4XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt22014226",
        releaseDate: "2023-01-06",
        description: "A Sanitation worker, how he stumbles upon magical powers which leads to a riveting new ride for the man, and how it stirs his humble life."
      },
      {
        id: "farzi", title: "Farzi", type: "series", genre: "Thriller",
        industry: "series", rating: "8.4",
        poster: "https://m.media-amazon.com/images/M/MV5BNDY2OWMxNzgtZGQ4Ny00ODI3LTk3MTAtYjM4N2U4ZGI3ZGY1XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg",
        streamUrl: "https://streamimdb.ru/embed/tv/tt15477488",
        releaseDate: "2023-02-05",
        description: "Dive deep into a captivating, gritty fictionalization exploring the untold high-stakes underbelly of modern entertainment, power structures, and ambition."
      }
    ];

    // ===================== MAP DB → series.html SHAPE =====================
    // series.html expects: { category, title, year, genre, rating, poster, banner, desc, url }
    const movies = contentDatabase
      .filter(m => m.type === "series") // ← only series
      .map(m => ({
        category: 'series',             // SECTIONS key
        title: m.title,
        year: (m.releaseDate || '').slice(0, 4) || 'N/A',
        genre: m.genre,
        rating: m.rating,
        poster: m.poster,
        banner: '',
        desc: m.description || '',
        url: m.streamUrl || ''
      }));

    const SECTIONS = { series: 'Must-Watch Web Series' };

    let cat = 'all';

    function card(m, i, wide) {
      return `
        <div onclick="openDetails(${i})" class="movie-card cursor-pointer ${wide ? '' : 'shrink-0 w-36 sm:w-44'} rounded-xl overflow-hidden bg-[#161b26] border border-slate-800">
          <div class="aspect-[2/3] bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center">
            ${m.poster ? `<img src="${m.poster}" alt="${m.title}" class="w-full h-full object-cover" onerror="this.style.display='none'" />` : `<i class="fa-solid fa-film text-3xl text-slate-600"></i>`}
          </div>
          <div class="p-2.5">
            <div class="flex justify-between text-[10px] font-bold uppercase mb-1"><span class="text-blue-400">${m.category}</span><span class="text-yellow-400">★ ${m.rating}</span></div>
            <p class="text-xs font-semibold text-slate-200 truncate">${m.title}</p>
            <p class="text-[11px] text-slate-500">${m.year} • ${m.genre}</p>
          </div>
        </div>`;
    }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const keys = cat === 'all' ? Object.keys(SECTIONS) : [cat];
      let total = 0;
      document.getElementById('rows').innerHTML = keys.map(k => {
        const list = movies.map((m, i) => ({ m, i })).filter(({ m }) => m.category === k && m.title.toLowerCase().includes(q));
        if (!list.length) return '';
        total += list.length;
        const single = true; // grid layout
        return `
          <section>
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-bold text-white border-l-4 border-brand-500 pl-3">${SECTIONS[k]}</h2>
              ${single ? '' : `<div class="flex gap-2">
                <button onclick="scrollRow('${k}',-1)" class="w-9 h-9 rounded-full bg-white/5 hover:bg-brand-500 text-white"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                <button onclick="scrollRow('${k}',1)" class="w-9 h-9 rounded-full bg-white/5 hover:bg-brand-500 text-white"><i class="fa-solid fa-chevron-right text-xs"></i></button></div>`}
            </div>
            <div id="row-${k}" class="${single ? 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4' : 'row-scroll no-sb flex gap-4 overflow-x-auto pb-2'}">
              ${list.map(({ m, i }) => card(m, i, single)).join('')}
            </div>
          </section>`;
      }).join('');
      document.getElementById('emptyMsg').classList.toggle('hidden', total > 0);
    }

    function scrollRow(k, dir) {
      const el = document.getElementById('row-' + k);
      el.scrollBy({ left: dir * el.clientWidth * 0.8 });
    }

    document.querySelectorAll('.ctab').forEach(b => b.onclick = () => setCat(b.dataset.cat));
    function setCat(c) {
      cat = c;
      document.querySelectorAll('.ctab').forEach(b => {
        b.className = 'ctab px-5 py-2 rounded-full whitespace-nowrap ' + (b.dataset.cat === c ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30' : 'bg-slate-900 text-slate-300 hover:text-white');
      });
      render();
    }

    // ===================== DETAILS =====================
    const detailsModal = document.getElementById('detailsModal');
    let current = null;
    function openDetails(i) {
      const m = movies[i]; current = m;
      document.getElementById('dBanner').style.backgroundImage = (m.banner || m.poster) ? `url('${m.banner || m.poster}')` : '';
      document.getElementById('dTitle').textContent = m.title;
      document.getElementById('dRating').textContent = '★ ' + m.rating;
      document.getElementById('dYear').textContent = m.year;
      document.getElementById('dGenre').textContent = m.genre;
      document.getElementById('dDesc').textContent = m.desc;
      document.getElementById('dPlay').onclick = () => playMovie(m);
      detailsModal.classList.remove('hidden'); detailsModal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
    function closeDetails() {
      detailsModal.classList.add('hidden'); detailsModal.classList.remove('flex');
      document.body.style.overflow = 'auto';
    }

    // ===================== PLAYER =====================
    const playerModal = document.getElementById('playerModal');
    const vid = document.getElementById('moviePlayer');
    const frame = document.getElementById('movieFrame');
    const noSource = document.getElementById('noSource');
    let hls = null;

    function stopPlayer() {
      if (hls) { hls.destroy(); hls = null; }
      vid.pause(); vid.removeAttribute('src'); vid.load();
      frame.src = '';
      [vid, frame].forEach(e => e.classList.add('hidden'));
      noSource.classList.add('hidden'); noSource.classList.remove('flex');
    }
    function playMovie(m) {
      stopPlayer();
      playerModal.classList.remove('hidden'); playerModal.classList.add('flex');
      if (!m.url) { noSource.classList.remove('hidden'); noSource.classList.add('flex'); return; }
      if (/\.m3u8(\?|$)/.test(m.url) && window.Hls && Hls.isSupported()) {
        vid.classList.remove('hidden');
        hls = new Hls(); hls.loadSource(m.url); hls.attachMedia(vid);
        hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
      } else if (/\.(mp4|webm|m3u8)(\?|$)/.test(m.url)) {
        vid.classList.remove('hidden'); vid.src = m.url; vid.play().catch(() => {});
      } else {
        frame.classList.remove('hidden'); frame.src = m.url;
      }
    }
    function closePlayer() {
      stopPlayer();
      playerModal.classList.add('hidden'); playerModal.classList.remove('flex');
    }
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!playerModal.classList.contains('hidden')) closePlayer(); else closeDetails();
    });

    render();
  </script>
</body>
</html>
