  <style>
    ::-webkit-scrollbar { width: 0; height: 0; }
    .no-sb { scrollbar-width: none; -ms-overflow-style: none; }
    .no-sb::-webkit-scrollbar { display: none; }

    html, body {
      overscroll-behavior: none;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: pan-x pan-y;
      user-select: none;
      -webkit-user-select: none;
      background: #0b0f19;
      height: 100%;
      overflow: hidden;
    }
    input, textarea { user-select: text; -webkit-user-select: text; }
    img { -webkit-user-drag: none; }

    /* App shell: body fixed, main is the scroll container (kills pull-to-refresh) */
    #appShell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    .app-header { padding-top: env(safe-area-inset-top); flex-shrink: 0; }
    .bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom) + 6px); }

    main.page {
      position: relative;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    .channel-card:active, .row-card:active { transform: scale(0.95); transition: transform .08s ease; }
    .row-card { transition: transform .15s ease; will-change: transform; }

    .hscroll { overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
    .hscroll > * { scroll-snap-align: start; }

    #splashScreen {
      position: fixed; inset: 0; z-index: 9999; background: #0b0f19;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1.5rem;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #splashScreen.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
    #splashScreen img {
      width: 110px; height: 110px; object-fit: contain;
      border-radius: 22px; animation: splashPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(37,99,235,.45));
    }
    #splashScreen .splash-title { font-size: 1.6rem; font-weight: 900; letter-spacing: -.02em; }
    #splashScreen .splash-loader { width: 160px; height: 4px; background: #1e293b; border-radius: 9999px; overflow: hidden; margin-top: .5rem; }
    #splashScreen .splash-loader span {
      display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 9999px; animation: splashLoad 1.2s ease-in-out infinite;
    }
    @keyframes splashLoad { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

    #playerModal { transition: opacity .2s ease; }

    .bnav-item { color: #64748b; transition: color .15s ease; }
    .bnav-item.active { color: #3b82f6; }
    .bnav-item.active i { transform: translateY(-1px); }
    .bnav-item i { transition: transform .15s ease; }
  </style>

  <script>
    (function initSplash() {
      const splash = document.getElementById('splashScreen');
      if (sessionStorage.getItem('stn_splash_shown')) { splash.classList.add('splash-hidden'); return; }
      sessionStorage.setItem('stn_splash_shown', '1');
      const hide = () => setTimeout(() => splash.classList.add('splash-hidden'), 500);
      if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide);
      setTimeout(() => splash.classList.add('splash-hidden'), 2500);
    })();

    (function androidBack() {
      let pushed = false;
      window.__androidGuard = {
        pushGuard() { if (!pushed) { history.pushState({ g: 1 }, ''); pushed = true; } },
        popGuard() { if (pushed) { history.back(); pushed = false; } }
      };
      window.addEventListener('popstate', () => {
        pushed = false;
        const pm = document.getElementById('playerModal');
        if (pm && !pm.classList.contains('hidden') && getComputedStyle(pm).opacity !== '0') {
          if (typeof closePlayer === 'function') closePlayer();
          return;
        }
      });
    })();

    function toggleSearch() {
      const bar = document.getElementById('searchBar');
      bar.classList.toggle('hidden');
      if (!bar.classList.contains('hidden')) document.getElementById('searchInput').focus();
    }

      { id: "history-tv", name: "History TV18", categoryKey: "entertainment", logoText: "HIST", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/History_TV18_logo.svg/512px-History_TV18_logo.svg.png",
        url: "https://d1l4jgwfvc1j3f.cloudfront.net/HistoryTV18/index.m3u8" },
      { id: "travel-xp", name: "Travel XP", categoryKey: "entertainment", logoText: "TXP", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Travelxp_logo.svg/512px-Travelxp_logo.svg.png",
        url: "https://d1l4jgwfvc1j3f.cloudfront.net/TravelXP/index.m3u8" },
      { id: "food-food", name: "Food Food", categoryKey: "entertainment", logoText: "FF", badge: "HD",

        url: "https://d1l4jgwfvc1j3f.cloudfront.net/FoodFood/index.m3u8" },
      { id: "zoom", name: "Zoom", categoryKey: "entertainment", logoText: "ZOOM", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Zoom_TV_logo.svg/512px-Zoom_TV_logo.svg.png",
        url: "https://d1l4jgwfvc1j3f.cloudfront.net/Zoom/index.m3u8" },

      // ============ MOVIES ============
      { id: "b4umovies", name: "B4U Movies", categoryKey: "movies", logoText: "B4U", badge: "HD",
        logoUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEnzxdP8-VmS1m5nxukY7H-EI3TiuHbD7D7I-CZQYGkg&s",
        url: "https://streams.tangotv.in/B4UMOVIES/ORIGIN/index.m3u8" },
      { id: "star-gold", name: "Star Gold", categoryKey: "movies", logoText: "SG", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Star_Gold_logo.svg/512px-Star_Gold_logo.svg.png",
        url: "https://d1rc86nwwc9fag.cloudfront.net/260723/stargolduk_2500/chunklist.m3u8" },
      { id: "sony-max", name: "Sony Max", categoryKey: "movies", logoText: "SM", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Sony_MAX_logo.svg/512px-Sony_MAX_logo.svg.png",
        url: "https://d1l4jgwfvc1j3f.cloudfront.net/SonyMax/index.m3u8" },
      { id: "zee-cinema", name: "Zee Cinema", categoryKey: "movies", logoText: "ZC", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Zee_Cinema_logo.svg/512px-Zee_Cinema_logo.svg.png",
        url: "https://d1l4jgwfvc1j3f.cloudfront.net/ZeeCinema/index.m3u8" },
      { id: "set-max", name: "SET Max", categoryKey: "movies", logoText: "MAX", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/SET_Max_logo.svg/512px-SET_Max_logo.svg.png",
        url: "https://d1l4jgwfvc1j3f.cloudfront.net/SETMax/index.m3u8" },
      { id: "colors-cineplex", name: "Colors Cineplex", categoryKey: "movies", logoText: "CC", badge: "HD",
        logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Colors_Cineplex_logo.svg/512px-Colors_Cineplex_logo.svg.png",
        url: "https://d1l4jgwfvc1j3f.cloudfront.net/ColorsCineplex/index.m3u8" }
    ];

    // ===================== PLAYLISTS =====================
    const PLAYLISTS = [
      { name: "India (Hindi & more)", url: "https://iptv-org.github.io/iptv/countries/in.m3u", defaultCategory: "entertainment" },
      { name: "Nepal", url: "https://iptv-org.github.io/iptv/countries/np.m3u", defaultCategory: "nepali" }
    ];

    const CATEGORY_META = {
      "nepali":        { label: "Nepali",          color: "bg-red-500"     },
      "news":          { label: "News",            color: "bg-sky-500"     },
      "sports":        { label: "Sports",          color: "bg-green-500"   },
      "music":         { label: "Music",           color: "bg-purple-500"  },
      "entertainment": { label: "Entertainment",   color: "bg-amber-500"   },
      "movies":        { label: "Movies",          color: "bg-pink-500"    },
      "kids":          { label: "Kids",            color: "bg-cyan-500"    }
    };
    const CATEGORY_ORDER = ["nepali", "news", "sports", "music", "entertainment", "movies", "kids"];

    let channels = [...staticChannels];

    // ===================== M3U PARSER =====================
    function detectCategory(groupTitle, name, defaultCategory) {
      const g = (groupTitle || '').toLowerCase();
      const n = (name || '').toLowerCase();

      if (/nepal/.test(g)) return 'nepali';

      if (/sport|cricket|football|soccer|nba|tennis|f1|motogp/.test(g) || /\bsports?\b|\bcricket\b/.test(n)) return 'sports';
      if (/music|song|mtv|vh1/.test(g) || /\bmusic\b|\bmtv\b/.test(n)) return 'music';
      if (/kid|child|cartoon|toon|junior/.test(g) || /\bkids?\b|cartoon|\btoon\b/.test(n)) return 'kids';
      if (/movie|cinema|film|bollywood|hollywood/.test(g) || /\bmovies?\b|\bcinema\b|\bfilms?\b/.test(n)) return 'movies';
      if (/news/.test(g) || /\bnews\b/.test(n)) return 'news';
      if (/entertainment|serial|drama|comedy|reality|show/.test(g)) return 'entertainment';

      return defaultCategory || 'entertainment';
    }

    function parseM3U(text, playlistInfo) {
      const lines = text.split('\n');
      const out = [];
      let info = null;
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.*)$/);
          const name = nameMatch ? nameMatch[1].trim() : 'Unknown';
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const groupMatch = line.match(/group-title="([^"]*)"/);
          const groupTitle = groupMatch ? groupMatch[1] : '';
          const categoryKey = detectCategory(groupTitle, name, playlistInfo.defaultCategory);
          info = {
            name,
            logoUrl: logoMatch ? logoMatch[1] : '',
            logoText: name.split(/[\s\-_]+/).filter(Boolean).map(w => w[0]).join('').slice(0, 4).toUpperCase() || 'TV',
            categoryKey,
            playlistGroup: playlistInfo.name,
            badge: 'LIVE'
          };
        } else if (line && !line.startsWith('#') && info) {
          info.url = line;
          out.push(info);
          info = null;
        }
      }
      return out;
    }

    // ===================== RENDER HOME ROWS =====================
    const dynamicRowsEl = document.getElementById('dynamicRows');

    function rowCard(ch, i) {
      return `
        <div onclick="openPlayer(${i})" class="row-card shrink-0 w-[130px] cursor-pointer bg-[#161b26] rounded-xl overflow-hidden border border-slate-800 relative">
          ${ch.badge ? `<div class="absolute top-1 right-1 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">${ch.badge}</div>` : ''}
          <div class="aspect-square bg-white flex items-center justify-center p-4">
            ${ch.logoUrl
              ? `<img src="${ch.logoUrl}" class="max-h-full object-contain" alt="${ch.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><span class="hidden text-slate-900 font-bold text-base text-center">${ch.logoText}</span>`
              : `<span class="text-slate-900 font-bold text-base text-center">${ch.logoText}</span>`}
          </div>
          <div class="p-2">
            <p class="text-[11px] font-semibold text-slate-200 truncate">${ch.name}</p>
          </div>
        </div>`;
    }

    function renderHomeRows() {
      const groups = {};
      channels.forEach((ch, i) => {
        if (!ch.categoryKey) ch.categoryKey = 'entertainment';
        if (!groups[ch.categoryKey]) groups[ch.categoryKey] = [];
        groups[ch.categoryKey].push({ ch, i });
      });

      let html = '';
      for (const key of CATEGORY_ORDER) {
        const items = groups[key];
        if (!items || !items.length) continue;
        const meta = CATEGORY_META[key] || { label: key, color: 'bg-slate-500' };
        html += `
          <section id="${key}-section" class="mt-6">
            <div class="flex items-center justify-between px-4 mb-3">
              <h3 class="text-base font-bold text-white flex items-center gap-2">
                <span class="w-1 h-4 ${meta.color} rounded-full"></span> ${meta.label}
                <span class="text-[10px] text-slate-500 font-normal">(${items.length})</span>
              </h3>
              <button onclick="openCategory('${key}')" class="text-xs text-blue-400 font-semibold">See all <i class="fa-solid fa-chevron-right text-[9px] ml-0.5"></i></button>
            </div>
            <div class="hscroll no-sb flex gap-3 px-4 pb-2">
              ${items.slice(0, 12).map(({ ch, i }) => rowCard(ch, i)).join('')}
            </div>
          </section>`;
      }
      dynamicRowsEl.innerHTML = html || '<p class="px-4 py-10 text-center text-slate-500 text-sm">No channels yet — loading playlists…</p>';
    }
    renderHomeRows();

    // ===================== LOAD PLAYLISTS (with cache) =====================
    async function loadPlaylists() {
      const CACHE_KEY = 'stn_playlists_v1';
      const CACHE_TTL = 1000 * 60 * 60 * 6; // 6 hours

      // Try cache first — instant
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const { ts, data } = JSON.parse(cached);
          if (Date.now() - ts < CACHE_TTL && Array.isArray(data) && data.length) {
            const seen = new Set(staticChannels.map(c => c.url));
            const uniq = data.filter(c => c.url && !seen.has(c.url) && seen.add(c.url));
            channels = [...staticChannels, ...uniq];
            renderHomeRows();
            buildFilterTabs();
            renderPanel();
            return;
          }
        }
      } catch (e) { /* ignore cache errors */ }

      // Otherwise fetch
      const loaded = [];
      for (const p of PLAYLISTS) {
        try {
          const res = await fetch(p.url);
          const text = await res.text();
          const chans = parseM3U(text, p);
          loaded.push(...chans);
        } catch (e) {
          console.warn('Failed to load playlist', p.name, e);
        }
      }
      if (loaded.length) {
        const seen = new Set(staticChannels.map(c => c.url));
        const uniq = loaded.filter(c => c.url && !seen.has(c.url) && seen.add(c.url));
        channels = [...staticChannels, ...uniq];
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: uniq }));
        } catch (e) { /* quota exceeded, ignore */ }
        renderHomeRows();
        buildFilterTabs();
        renderPanel();
      }
    }
    loadPlaylists();

    // ===================== SEARCH =====================
    function filterChannels() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.row-card').forEach(c => {
        c.style.display = c.querySelector('p').textContent.toLowerCase().includes(q) ? 'block' : 'none';
      });
    }

    // ===================== PLAYER LOGIC =====================
    const playerModal = document.getElementById('playerModal');
    const video = document.getElementById('videoPlayer');
    const modalChannelTitle = document.getElementById('modalChannelTitle');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorMessage = document.getElementById('errorMessage');
    const panelGrid = document.getElementById('panelGrid');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnMute = document.getElementById('btnMute');
    const btnFullscreen = document.getElementById('btnFullscreen');

    let hls = null, currentUrl = '', currentIndex = -1, panelFilter = 'all';
    let loadingTimer = null;

    function togglePlay() {
      if (video.paused) { video.play(); } else { video.pause(); }
    }

    video.addEventListener('play', () => {
      btnPlayPause.innerHTML = '<i class="fa-solid fa-pause text-lg"></i>';
    });
    video.addEventListener('pause', () => {
      btnPlayPause.innerHTML = '<i class="fa-solid fa-play text-lg"></i>';
    });

    function toggleMute() {
      video.muted = !video.muted;
      btnMute.innerHTML = video.muted
        ? '<i class="fa-solid fa-volume-xmark text-lg"></i>'
        : '<i class="fa-solid fa-volume-high text-lg"></i>';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        video.requestFullscreen().catch(err => console.log(`Fullscreen error: ${err.message}`));
        btnFullscreen.innerHTML = '<i class="fa-solid fa-compress text-lg"></i>';
      } else {
        document.exitFullscreen();
        btnFullscreen.innerHTML = '<i class="fa-solid fa-expand text-lg"></i>';
      }
    }

    document.addEventListener('fullscreenchange', () => {
      btnFullscreen.innerHTML = document.fullscreenElement
        ? '<i class="fa-solid fa-compress text-lg"></i>'
        : '<i class="fa-solid fa-expand text-lg"></i>';
    });

    function buildFilterTabs() {
      const tabContainer = document.getElementById('filterTabs');
      const catsInUse = new Set(channels.map(c => c.categoryKey).filter(Boolean));
      const available = CATEGORY_ORDER.filter(k => catsInUse.has(k));

      tabContainer.innerHTML =
        `<button data-f="all" class="ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-blue-600 text-white shadow-lg shadow-blue-500/30">All</button>` +
        available.map(k => {
          const label = (CATEGORY_META[k] && CATEGORY_META[k].label) || k;
          return `<button data-f="${k}" class="ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300">${label}</button>`;
        }).join('');

      tabContainer.querySelectorAll('.ptab').forEach(b => b.onclick = () => setFilter(b.dataset.f));
    }

    function renderPanel() {
      const filtered = channels
        .map((c, i) => ({ c, i }))
        .filter(({ c }) => panelFilter === 'all' || c.categoryKey === panelFilter);

      if (!filtered.length) {
        panelGrid.innerHTML = `<p class="col-span-4 text-center text-slate-500 text-xs py-8">No channels in this category yet.</p>`;
        return;
      }

      panelGrid.innerHTML = filtered.map(({ c, i: realIdx }) => `
        <button onclick="playByIndex(${realIdx})"
          class="w-full aspect-square rounded-xl bg-white flex items-center justify-center p-2 border-2 transition-transform active:scale-95 ${realIdx === currentIndex ? 'border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.5)]' : 'border-transparent opacity-80'}">
          ${c.logoUrl
            ? `<img src="${c.logoUrl}" class="max-w-full max-h-full object-contain" loading="lazy" onerror="this.outerHTML='<span class=\\'text-slate-900 font-bold text-[12px] text-center break-words leading-tight\\'>${c.logoText}</span>'" />`
            : `<span class="text-slate-900 font-bold text-[12px] text-center break-words leading-tight">${c.logoText}</span>`}
        </button>`).join('');
    }

    function setFilter(f) {
      panelFilter = f;
      document.querySelectorAll('.ptab').forEach(b => {
        const on = b.dataset.f === f;
        b.className = 'ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors ' +
          (on ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-800 text-slate-300');
      });
      renderPanel();
    }

    function playByIndex(i) {
      const c = channels[i];
      if (!c) return;
      currentIndex = i;
      currentUrl = c.url;
      modalChannelTitle.textContent = c.name;
      renderPanel();
      initStream(c.url);
    }

    function openPlayer(i, initialFilter) {
      playerModal.classList.remove('hidden');
      setTimeout(() => playerModal.classList.remove('opacity-0'), 10);
      document.body.style.overflow = 'hidden';

      // Warm up the video element immediately
      video.preload = 'auto';
      video.muted = true;
      try { video.load(); } catch (e) {}

      buildFilterTabs();
      setFilter(initialFilter || 'all');
      playByIndex(i);
      window.__androidGuard?.pushGuard();
    }

    function closePlayer() {
      playerModal.classList.add('opacity-0');
      setTimeout(() => {
        playerModal.classList.add('hidden');
        document.body.style.overflow = '';
        if (hls) { hls.destroy(); hls = null; }
        video.pause();
        video.removeAttribute('src');
        try { video.load(); } catch (e) {}
        if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
      }, 200);
    }

    function initStream(url) {
      if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }

      loadingOverlay.classList.remove('hidden');
      errorOverlay.classList.add('hidden');
      if (hls) { hls.destroy(); hls = null; }

      // Hide loader as soon as video truly starts playing
      const onPlaying = () => {
        if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
        loadingOverlay.classList.add('hidden');
        video.removeEventListener('playing', onPlaying);
      };
      video.addEventListener('playing', onPlaying);

      // Fallback error after 12s
      loadingTimer = setTimeout(() => {
        loadingOverlay.classList.add('hidden');
        showError('Stream is taking too long. Tap Retry.');
      }, 12000);

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          startLevel: 0,
          capLevelToPlayerSize: true,
          abrEwmaDefaultEstimate: 300000,
          maxBufferLength: 8,
          maxMaxBufferLength: 20,
          manifestLoadingTimeOut: 6000,
          manifestLoadingMaxRetry: 1,
          levelLoadingTimeOut: 6000,
          levelLoadingMaxRetry: 1,
          fragLoadingTimeOut: 10000,
          fragLoadingMaxRetry: 2,
          liveSyncDurationCount: 2,
          liveMaxLatencyDurationCount: 5,
          autoStartLoad: true,
          startFragPrefetch: true
        });
        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            if (!hls.retried) { hls.retried = true; setTimeout(() => hls.startLoad(), 1000); }
            else showError('Network error — stream unreachable.');
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else showError('Playback failed.');
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.onloadedmetadata = () => video.play().catch(() => {});
        video.onerror = () => showError('Native playback failed.');
      } else showError('HLS not supported.');
    }

    function showError(msg) {
      if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
      loadingOverlay.classList.add('hidden');
      errorOverlay.classList.remove('hidden');
      errorMessage.textContent = msg;
    }
    function retryStream() { if (currentUrl) initStream(currentUrl); }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !playerModal.classList.contains('hidden')) closePlayer();
    });

    function showView(v) {
      document.querySelectorAll('.bnav-item[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === v));
      document.getElementById('homeMain')?.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openCategory(catKey) {
      const idx = channels.findIndex(c => c.categoryKey === catKey);
      if (idx === -1) { openPlayer(0); return; }
      document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
      if (catKey === 'nepali') document.querySelector('[data-nav="live"]')?.classList.add('active');
      openPlayer(idx, catKey);
    }
  </script>
