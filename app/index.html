<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f19] text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Stream TV Nepal</title>

  <meta name="theme-color" content="#0b0f19" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.json" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/itsayushacharya/Stream-TV-Nepal/refs/heads/main/images/site-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { brand: { 500: '#2563eb', 600: '#1d4ed8' }, dark: '#0b0f19' },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
    } } }
  </script>
  <style>
    ::-webkit-scrollbar { width: 0; height: 0; }
    .no-sb { scrollbar-width: none; -ms-overflow-style: none; }
    .no-sb::-webkit-scrollbar { display: none; }

    /* ============ ANDROID APP FEEL ============ */
    html, body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: #0b0f19;
    }
    input, textarea { user-select: text; -webkit-user-select: text; }
    img { -webkit-user-drag: none; }

    /* Safe area (notch + gesture bar) */
    .app-header { padding-top: env(safe-area-inset-top); }
    .bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom) + 6px); }
    main.page { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }

    /* Card tap feedback */
    .channel-card:active, .row-card:active { transform: scale(0.95); transition: transform .08s ease; }
    .row-card { transition: transform .15s ease; }

    /* Hide scrollbar on horizontal rows */
    .hscroll { overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
    .hscroll > * { scroll-snap-align: start; }

    /* Splash */
    #splashScreen {
      position: fixed; inset: 0; z-index: 9999; background: #0b0f19;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1.5rem;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #splashScreen.splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
    #splashScreen img {
      width: 110px; height: 110px; object-fit: contain;
      border-radius: 22px; animation: splashPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(37,99,235,.45));
    }
    #splashScreen .splash-title { font-size: 1.6rem; font-weight: 900; letter-spacing: -.02em; }
    #splashScreen .splash-loader { width: 160px; height: 4px; background: #1e293b; border-radius: 9999px; overflow: hidden; margin-top: .5rem; }
    #splashScreen .splash-loader span {
      display: block; height: 100%; width: 40%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 9999px; animation: splashLoad 1.2s ease-in-out infinite;
    }
    @keyframes splashLoad { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

    /* Fullscreen Player Modal */
    #playerModal { transition: opacity .25s ease; }

    /* Bottom nav active state */
    .bnav-item { color: #64748b; transition: color .15s ease; }
    .bnav-item.active { color: #3b82f6; }
    .bnav-item.active i { transform: translateY(-1px); }
    .bnav-item i { transition: transform .15s ease; }
  </style>
</head>
<body class="h-full antialiased selection:bg-brand-500 selection:text-white">

  <!-- SPLASH -->
  <div id="splashScreen">
    <img src="https://raw.githubusercontent.com/itsayushacharya/Stream-TV-Nepal/refs/heads/main/images/site-icon.png" alt="Stream TV Nepal" />
    <div class="splash-title text-center">
      <span class="text-blue-500">Stream</span><span class="text-white">TV Nepal</span>
    </div>
    <div class="splash-loader"><span></span></div>
  </div>

  <!-- TOP APP BAR (Android style) -->
  <header class="app-header sticky top-0 z-40 bg-[#0b0f19]/95 backdrop-blur-md border-b border-slate-800">
    <div class="flex items-center justify-between h-14 px-4">
      <div class="flex items-center font-black text-xl tracking-tight">
        <span class="text-blue-500">Stream</span><span class="text-white">TV</span>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="toggleSearch()" class="w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center text-slate-300">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Search bar (hidden until tap) -->
    <div id="searchBar" class="hidden px-4 pb-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
        <input type="text" id="searchInput" placeholder="Search channels..." oninput="filterChannels()"
          class="w-full bg-slate-900 border border-slate-700 text-sm rounded-full pl-9 pr-10 py-2.5 focus:outline-none focus:border-brand-500 placeholder-slate-500 text-white">
        <button onclick="toggleSearch()" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full hover:bg-white/10 flex items-center justify-center text-slate-400">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main id="homeMain" class="page relative z-10">

    <!-- HERO (compact mobile banner) -->
    <section id="heroSection" class="relative mx-3 mt-3 rounded-2xl overflow-hidden bg-slate-900 border border-slate-800">
      <div class="absolute inset-0">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBxnUkh7jJ8aUJjuMHL4Uo-tBVsvSC-Bv3rxH8nB_qF9hyEmEG8CItsNAJ&s=10"
          class="w-full h-full object-cover object-center opacity-40" alt="" />
        <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-[#0b0f19]/70 to-transparent"></div>
      </div>
      <div class="relative p-5 pt-16">
        <p class="text-[10px] font-bold tracking-widest text-blue-400 mb-1">STREAM TV NEPAL</p>
        <h1 class="text-2xl font-black text-white leading-tight mb-1">
          Your Screen, Your Stream
        </h1>
        <p class="text-sm text-slate-300 mb-4">Live channels, movies & shows — all in one place.</p>
        <div class="flex gap-2">
          <button onclick="scrollToSection('news-section')"
            class="flex-1 bg-brand-500 hover:bg-brand-600 text-white font-bold py-2.5 rounded-full text-sm shadow-lg shadow-brand-500/30">
            <i class="fa-solid fa-play mr-1.5"></i> Watch Now
          </button>
          <button onclick="openLive()"
            class="flex-1 bg-white/10 hover:bg-white/20 backdrop-blur text-white font-bold py-2.5 rounded-full text-sm border border-white/10">
            <i class="fa-solid fa-tv mr-1.5"></i> Live TV
          </button>
        </div>
      </div>
    </section>

    <!-- CHANNEL SECTIONS (horizontal scroll rows) -->
    <section id="news-section" class="mt-6">
      <div class="flex items-center justify-between px-4 mb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-500 rounded-full"></span> News
        </h3>
        <button onclick="openLive()" class="text-xs text-blue-400 font-semibold">See all <i class="fa-solid fa-chevron-right text-[9px] ml-0.5"></i></button>

      <div id="news-grid" class="hscroll no-sb flex gap-3 px-4 pb-2"></div>
    </section>

    <section id="sports-section" class="mt-6">
      <div class="flex items-center justify-between px-4 mb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <span class="w-1 h-4 bg-brand-500 rounded-full"></span> Sports
        </h3>
        <button onclick="openSport()" class="text-xs text-blue-400 font-semibold">See all <i class="fa-solid fa-chevron-right text-[9px] ml-0.5"></i></button>
      </div>
      <div id="sports-grid" class="hscroll no-sb flex gap-3 px-4 pb-2"></div>
    </section>

    <section id="entertainment-section" class="mt-6">

        <h3 class="text-base font-bold text-white flex items-center gap-2">

    </section>

    <div class="h-6"></div>
  </main>

  <!-- ================= REDESIGNED FULLSCREEN PLAYER (Top Video + Bottom List) ================= -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-[#0b0f19] hidden opacity-0 flex flex-col">
    
    <!-- TOP SECTION: Video & Controls -->
    <div class="relative bg-black w-full shrink-0 flex flex-col" style="padding-top: env(safe-area-inset-top);">
      
      <!-- Header Bar (Back + Title) -->
      <div class="w-full flex items-center gap-3 px-3 py-2 bg-black/90 z-20">
        <button onclick="closePlayer()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white shrink-0">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </button>
        <div class="min-w-0 flex-1">
          <h2 id="modalChannelTitle" class="text-white font-bold text-sm truncate">Channel Name</h2>
          <p class="text-[10px] text-red-500 font-bold flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> LIVE
          </p>
        </div>
      </div>

      <!-- Video Area (16:9 Aspect Ratio) -->
      <div class="relative w-full aspect-video bg-black flex items-center justify-center overflow-hidden">
        <video id="videoPlayer" class="w-full h-full object-contain" playsinline></video>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 flex items-center justify-center bg-black/40 z-10 pointer-events-none">
          <div class="w-10 h-10 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
        </div>

        <!-- Error Overlay -->
        <div id="errorOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-[#0b0f19]/95 hidden text-center p-6 z-10">
          <i class="fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-2"></i>
          <h3 class="text-white font-bold text-base mb-1">Stream Unavailable</h3>
          <p id="errorMessage" class="text-slate-400 text-xs max-w-xs mb-3"></p>
          <button onclick="retryStream()" class="bg-brand-500 text-white px-5 py-2 rounded-full text-sm font-semibold">
            <i class="fa-solid fa-rotate-right mr-1"></i> Retry
          </button>
        </div>
      </div>

      <!-- CUSTOM CONTROLS BAR (Play, Mute, Fullscreen) -->
      <div class="flex items-center justify-between px-4 py-2 bg-[#161b26] border-b border-slate-800 z-20">
        <div class="flex items-center gap-4">
          <button onclick="togglePlay()" id="btnPlayPause" class="text-white hover:text-blue-400 transition">
            <i class="fa-solid fa-pause text-lg"></i>
          </button>
          <button onclick="toggleMute()" id="btnMute" class="text-white hover:text-blue-400 transition">
            <i class="fa-solid fa-volume-high text-lg"></i>
          </button>
        </div>
        <div>
          <button onclick="toggleFullscreen()" id="btnFullscreen" class="text-white hover:text-blue-400 transition">
            <i class="fa-solid fa-expand text-lg"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM SECTION: Channel List -->
    <div class="flex-1 flex flex-col overflow-hidden bg-[#0b0f19]">
      <!-- Filters -->
      <div class="px-3 py-3 shrink-0 bg-[#0b0f19] border-b border-slate-800/50">
        <div class="flex gap-2 overflow-x-auto no-sb">
          <button data-f="all" class="ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-blue-600 text-white shadow-lg shadow-blue-500/30">All</button>
          <button data-f="news" class="ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300">News</button>
          <button data-f="sports" class="ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300">Sports</button>
          <button data-f="entertainment" class="ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300">Entertainment</button>
        </div>
      </div>

      <!-- Grid of Channels (Scrollable) -->
      <div class="flex-1 overflow-y-auto no-sb p-3">
        <div id="panelGrid" class="grid grid-cols-4 gap-3"></div>
      </div>
    </div>

        <span class="text-[10px] font-semibold">Movies</span>
      </a>
      <a href="series.html" data-nav="series" class="bnav-item flex flex-col items-center justify-center gap-0.5 px-4 py-1">
        <i class="fa-solid fa-layer-group text-lg"></i>
        <span class="text-[10px] font-semibold">Series</span>
      </a>
    </div>
  </nav>

  <script>
    // ===================== SPLASH =====================
    (function initSplash() {
      const splash = document.getElementById('splashScreen');
      if (sessionStorage.getItem('stn_splash_shown')) { splash.classList.add('splash-hidden'); return; }
      sessionStorage.setItem('stn_splash_shown', '1');
      const hide = () => setTimeout(() => splash.classList.add('splash-hidden'), 700);
      if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide);
      setTimeout(() => splash.classList.add('splash-hidden'), 3000);
    })();

    // ===================== ANDROID BACK =====================
    (function androidBack() {
      let pushed = false;
      window.__androidGuard = {
        pushGuard() { if (!pushed) { history.pushState({ g: 1 }, ''); pushed = true; } },
        popGuard() { if (pushed) { history.back(); pushed = false; } }
      };
      window.addEventListener('popstate', () => {
        pushed = false;
        const pm = document.getElementById('playerModal');
        if (pm && !pm.classList.contains('hidden') && getComputedStyle(pm).opacity !== '0') {
          if (typeof closePlayer === 'function') closePlayer();
          return;
        }
      });
    })();

    // ===================== SEARCH =====================
    function toggleSearch() {
      const bar = document.getElementById('searchBar');
      bar.classList.toggle('hidden');
      if (!bar.classList.contains('hidden')) document.getElementById('searchInput').focus();

    const PLAYLISTS = [

    ];

    let channels = [...staticChannels];

    // ===================== M3U PARSER =====================
    function parseM3U(text, groupName) {
      const lines = text.split('\n');
      const out = [];
      let info = null;
      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.*)$/);
          const name = nameMatch ? nameMatch[1].trim() : 'Unknown';
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          info = {
            name,
            logoUrl: logoMatch ? logoMatch[1] : '',
            logoText: name.split(' ').map(w => w[0]).join('').slice(0, 4).toUpperCase(),
            categoryKey: 'entertainment',
            playlistGroup: groupName,
            badge: 'LIVE'
          };
        } else if (line && !line.startsWith('#') && info) {
          info.url = line;
          out.push(info);
          info = null;
        }
      }
      return out;
    }

    // ===================== RENDER HOME ROWS =====================
    const grids = {
      news: document.getElementById('news-grid'),
      sports: document.getElementById('sports-grid'),
      entertainment: document.getElementById('entertainment-grid')
    };

    function rowCard(ch, i) {
      return `
        <div onclick="openPlayer(${i})" class="row-card shrink-0 w-[130px] cursor-pointer bg-[#161b26] rounded-xl overflow-hidden border border-slate-800 relative">
          ${ch.badge ? `<div class="absolute top-1 right-1 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10">${ch.badge}</div>` : ''}
          <div class="aspect-square bg-white flex items-center justify-center p-4">
            ${ch.logoUrl
              ? `<img src="${ch.logoUrl}" class="max-h-full object-contain" alt="${ch.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" /><span class="hidden text-slate-900 font-bold text-base text-center">${ch.logoText}</span>`
              : `<span class="text-slate-900 font-bold text-base text-center">${ch.logoText}</span>`}
          </div>
          <div class="p-2">
            <p class="text-[11px] font-semibold text-slate-200 truncate">${ch.name}</p>
          </div>
        </div>`;
    }

    function renderHomeRows() {
      const html = { news: '', sports: '', entertainment: '' };
      channels.forEach((ch, i) => {
        if (html[ch.categoryKey] !== undefined) html[ch.categoryKey] += rowCard(ch, i);
      });
      for (const k in grids) {
        if (grids[k]) grids[k].innerHTML = html[k] || '';
      }
    }
    renderHomeRows();

    // ===================== LOAD PLAYLISTS =====================
    async function loadPlaylists() {
      const loaded = [];
      for (const p of PLAYLISTS) {
        try {
          const res = await fetch(p.url);
          const text = await res.text();
          const chans = parseM3U(text, p.name);
          loaded.push(...chans);
        } catch (e) {
          console.warn('Failed to load playlist', p.name, e);
        }
      }
      if (loaded.length) {
        channels = [...staticChannels, ...loaded];
        renderHomeRows();
        renderPanel(); 
      }
    }
    loadPlaylists();

    // ===================== SEARCH =====================
    function filterChannels() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.row-card').forEach(c => {
        c.style.display = c.querySelector('p').textContent.toLowerCase().includes(q) ? 'block' : 'none';
      });
    }

    const panelGrid = document.getElementById('panelGrid');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnMute = document.getElementById('btnMute');
    const btnFullscreen = document.getElementById('btnFullscreen');

    let hls = null, currentUrl = '', currentIndex = -1, panelFilter = 'all';

    // Custom Controls
    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    video.addEventListener('play', () => {
      btnPlayPause.innerHTML = '<i class="fa-solid fa-pause text-lg"></i>';
    });
    video.addEventListener('pause', () => {
      btnPlayPause.innerHTML = '<i class="fa-solid fa-play text-lg"></i>';
    });

    function toggleMute() {
      video.muted = !video.muted;
      if (video.muted) {
        btnMute.innerHTML = '<i class="fa-solid fa-volume-xmark text-lg"></i>';
      } else {
        btnMute.innerHTML = '<i class="fa-solid fa-volume-high text-lg"></i>';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        video.requestFullscreen().catch(err => {
          console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
        btnFullscreen.innerHTML = '<i class="fa-solid fa-compress text-lg"></i>';
      } else {
        document.exitFullscreen();
        btnFullscreen.innerHTML = '<i class="fa-solid fa-expand text-lg"></i>';
      }
    }
    
    // Sync fullscreen icon if user exits fullscreen via native controls / ESC
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        btnFullscreen.innerHTML = '<i class="fa-solid fa-expand text-lg"></i>';
      } else {
        btnFullscreen.innerHTML = '<i class="fa-solid fa-compress text-lg"></i>';
      }
    });

    // Grid rendering for player panel
    function renderPanel() {
      const filtered = channels
        .map((c, i) => ({ c, i }))
        .filter(({ c }) => panelFilter === 'all' || c.categoryKey === panelFilter);
      
      panelGrid.innerHTML = filtered.map(({ c, i: realIdx }) => `
        <button onclick="playByIndex(${realIdx})"
          class="w-full aspect-square rounded-xl bg-white flex items-center justify-center p-2 border-2 transition-transform active:scale-95 ${realIdx === currentIndex ? 'border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.5)]' : 'border-transparent opacity-80'}">
          ${c.logoUrl
            ? `<img src="${c.logoUrl}" class="max-w-full max-h-full object-contain" onerror="this.outerHTML='<span class=\\'text-slate-900 font-bold text-[12px] text-center break-words leading-tight\\'>${c.logoText}</span>'" />`
            : `<span class="text-slate-900 font-bold text-[12px] text-center break-words leading-tight">${c.logoText}</span>`}
        </button>`).join('');
    }

    function setFilter(f) {
      panelFilter = f;
      document.querySelectorAll('.ptab').forEach(b => {
        const on = b.dataset.f === f;
        b.className = 'ptab px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors ' +
          (on ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/30' : 'bg-slate-800 text-slate-300');
      });
      renderPanel();
    }
    document.querySelectorAll('.ptab').forEach(b => b.onclick = () => setFilter(b.dataset.f));

    function playByIndex(i) {
      const c = channels[i];
      if (!c) return;
      currentIndex = i;
      currentUrl = c.url;
      modalChannelTitle.textContent = c.name;
      renderPanel();
      initStream(c.url);
    }

    function openPlayer(i) {
      playerModal.classList.remove('hidden');
      setTimeout(() => playerModal.classList.remove('opacity-0'), 10);
      document.body.style.overflow = 'hidden';
      setFilter('all');
      playByIndex(i);
      window.__androidGuard?.pushGuard();
    }

    function closePlayer() {
      playerModal.classList.add('opacity-0');
      setTimeout(() => {
        playerModal.classList.add('hidden');
        document.body.style.overflow = '';
        if (hls) { hls.destroy(); hls = null; }
        video.pause(); video.removeAttribute('src'); video.load();
      }, 250);
    }

    function initStream(url) {
      loadingOverlay.classList.remove('hidden');
      errorOverlay.classList.add('hidden');
      if (hls) { hls.destroy(); hls = null; }

      if (Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true, lowLatencyMode: true,
          manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 3,
          levelLoadingTimeOut: 15000, levelLoadingMaxRetry: 3,
          fragLoadingTimeOut: 20000, fragLoadingMaxRetry: 5
        });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          loadingOverlay.classList.add('hidden');
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            if (!hls.retried) { hls.retried = true; setTimeout(() => hls.startLoad(), 2000); }
            else showError('Network error — stream server unreachable or token expired.');
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else showError('Playback failed.');
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.onloadedmetadata = () => { loadingOverlay.classList.add('hidden'); video.play().catch(() => {}); };
        video.onerror = () => showError('Native playback failed.');
      } else showError('HLS not supported.');
    }

    function showError(msg) {
      loadingOverlay.classList.add('hidden');
      errorOverlay.classList.remove('hidden');
      errorMessage.textContent = msg;
    }
    function retryStream() { if (currentUrl) initStream(currentUrl); }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !playerModal.classList.contains('hidden')) closePlayer();
    });

    // Bottom nav
    function showView(v) {
      document.querySelectorAll('.bnav-item[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === v));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function openLive() {
      document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-nav="live"]')?.classList.add('active');
      openPlayer(0);
    }
    function openSport() {
      const i = channels.findIndex(c => c.categoryKey === 'sports');
      openPlayer(Math.max(0, i));
    }
    function openEntertainment() {
      const i = channels.findIndex(c => c.categoryKey === 'entertainment');
      openPlayer(Math.max(0, i));
    }
  </script>
</body>
</html>
